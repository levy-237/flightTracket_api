name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  build:
    name: Unit tests and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The application context test requires a database and starts the scheduler.
      # Run the remaining tests without connecting to an existing database.
      - name: Run unit tests
        run: sh ./mvnw -B --no-transfer-progress '-Dtest=!FlightdetectorApplicationTests' test

      - name: Build Docker image
        run: docker build --tag flightdetector:ci .
