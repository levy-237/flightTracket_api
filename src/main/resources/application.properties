spring.application.name=flightdetector
app.cors.allowed-origins=${ALLOW_CORS}
app.websocket.allowed-origin-patterns=${ALLOW_SOCKET}
adsb.url=${API_URL}
adsb.poll-interval-ms=31000
adsb.connect-timeout-ms=5000
adsb.read-timeout-ms=15000
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=false
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=true
